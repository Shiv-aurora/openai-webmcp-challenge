name: CI

on:
  push:
    branches: [main]
    paths:
      - src/**
      - tests/**
      - bin/**
      - package.json
      - package-lock.json
      - vite.config.js
      - .eslintrc.cjs
      - .eslintignore
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - src/**
      - tests/**
      - bin/**
      - package.json
      - package-lock.json
      - vite.config.js
      - .eslintrc.cjs
      - .eslintignore
      - .github/workflows/ci.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format Phase 2 branch for diagnostics
        if: github.head_ref == 'phase-2-provenance-native'
        run: |
          npx prettier --write src/integrity/provenance.js
          git diff -- src/integrity/provenance.js

      - name: Check formatting
        run: npm run check-format

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install collaboration server dependencies
        run: npm ci --prefix bin

      - name: Run browser tests
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/vite-preview.log 2>&1 &
          preview_pid=$!
          YPERSISTENCE=/tmp/myst-docs PORT=4455 node bin/server.js > /tmp/collaboration.log 2>&1 &
          collaboration_pid=$!

          cleanup() {
            kill "$preview_pid" "$collaboration_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/vite-preview.log
              exit 1
            fi
            sleep 1
          done

          sleep 2
          if ! npm run test; then
            echo "--- Vite preview log ---"
            cat /tmp/vite-preview.log
            echo "--- Collaboration server log ---"
            cat /tmp/collaboration.log
            exit 1
          fi

      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
