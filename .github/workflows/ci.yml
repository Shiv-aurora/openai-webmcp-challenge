name: CI

on:
  push:
    branches: [main]
    paths:
      - src/**
      - tests/**
      - bin/**
      - package.json
      - package-lock.json
      - vite.config.js
      - .eslintrc.cjs
      - .eslintignore
  pull_request:
    paths:
      - src/**
      - tests/**
      - bin/**
      - package.json
      - package-lock.json
      - vite.config.js
      - .eslintrc.cjs
      - .eslintignore

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run check-format

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
