name: Format Phase 2

on:
  push:
    branches:
      - phase-2-provenance-native

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format Phase 2 sources
        run: npm run format
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/integrity/provenance.js src/integrity/ResearchIntegrityPanel.jsx tests/research-integrity.spec.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format Phase 2 provenance implementation"
          git push origin HEAD:phase-2-provenance-native
