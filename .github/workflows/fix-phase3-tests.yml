name: Fix Phase 3 X-Ray tests

on:
  push:
    branches:
      - phase-3-research-xray

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply virtualization-aware test fix
        run: python scripts/fix_phase3_tests.py
      - name: Format tests
        run: npx prettier --write tests/research-integrity.spec.ts
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Research X-Ray browser assertions"
          git push origin HEAD:phase-3-research-xray
