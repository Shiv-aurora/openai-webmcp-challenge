name: Format Phase 4 WebMCP actions

on:
  push:
    branches:
      - phase-4-review-safe-actions
    paths:
      - .github/workflows/format-phase4-actions.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: phase-4-review-safe-actions
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format Phase 4 action files
        run: npx prettier --write src/webmcp/actionTools.js src/webmcp/register.js tests/webmcp-actions.spec.ts
      - name: Remove helper and commit formatting
        run: |
          rm .github/workflows/format-phase4-actions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format Phase 4 WebMCP actions"
          git push origin HEAD:phase-4-review-safe-actions
