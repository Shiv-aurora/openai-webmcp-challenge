name: Format Phase 4 WebMCP

on:
  push:
    branches: [phase-4-readonly-webmcp]
    paths:
      - .github/workflows/format-phase4.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: phase-4-readonly-webmcp
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format Phase 4 files
        run: npx prettier --write src/webmcp/register.js tests/webmcp-readonly.spec.ts
      - name: Remove one-shot workflow
        run: rm .github/workflows/format-phase4.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format Phase 4 WebMCP files"
          git push origin HEAD:phase-4-readonly-webmcp
