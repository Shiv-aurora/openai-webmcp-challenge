name: Format Phase 4 WebMCP reads

on:
  push:
    branches:
      - phase-4-read-coverage
    paths:
      - .github/workflows/format-phase4-read.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: phase-4-read-coverage
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format changed WebMCP source
        run: npx prettier --write src/webmcp/researchTools.js
      - name: Remove helper and commit formatting
        run: |
          rm .github/workflows/format-phase4-read.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format Phase 4 WebMCP reads"
          git push origin HEAD:phase-4-read-coverage
